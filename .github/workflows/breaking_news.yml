name: Breaking News Watcher

# Berjalan setiap 15 menit (UTC). WIB = UTC+7.
# Artikel hanya dibuat jika ada kandidat baru yang memenuhi ambang tren/kata kunci darurat.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-news-breaking
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Check breaking news
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: auto
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: llama-3.3-70b-versatile
          BREAKING_MAX: '2'
          BREAKING_TRAFFIC_THRESHOLD: '200'
        run: python automation/auto_news.py --mode breaking
