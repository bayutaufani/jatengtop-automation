name: Auto News Scheduled

# 07:00 WIB = 00:00 UTC
# 13:00 WIB = 06:00 UTC
# 19:00 WIB = 12:00 UTC
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-news-scheduled
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Generate 5 news drafts
        id: generate
        continue-on-error: true
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: auto
          GEMINI_MODEL: gemini-flash-latest
          GROQ_MODEL: openai/gpt-oss-120b
          NEWS_COUNT: '5'
          JATENG_COUNT: '3'
        run: |
          set -o pipefail
          python automation/auto_news.py --mode scheduled 2>&1 | tee auto_news.log

      - name: Tampilkan error
        if: steps.generate.outcome == 'failure'
        run: |
          echo "## Auto News gagal" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 auto_news.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Hentikan job jika gagal
        if: steps.generate.outcome == 'failure'
        run: exit 1
